name: Docs

on:
  push:
    branches: ["main"]
  workflow_dispatch:   # allow manual re-runs from the Actions tab

# Allow the job to push to gh-pages
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-${{ hashFiles('**/conanfile.*') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-docs-${{ hashFiles('docs/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-docs-

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Doxygen
        run: sudo apt-get install -y doxygen

      - name: Install sdsl (builds the C++ extension)
        run: pip install ./sdsl

      - name: Install doc dependencies
        run: pip install -r docs/requirements.txt

      - name: Build docs
        run: sphinx-build docs/ docs/_build/html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
